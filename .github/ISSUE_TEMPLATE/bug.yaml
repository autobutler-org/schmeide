name: Bug Report
description: File a bug report.
title: "[Bug] "
labels:
  - bug
assignees: []
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also, what did you expect to happen? Name the control node, runner, steward, or gate if the failure is in one of those.
      placeholder: What is going on?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL of problem
      description: Provide a URL (local or remote) that demonstrates the problem.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Copy and paste any relevant log output from the control node, the runner, or the gate. This is rendered as code, so no backticks are needed.
      render: shell
